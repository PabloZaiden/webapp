name: Release NPM Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.2.3
        required: true

jobs:
  publish:
    name: Publish @pablozaiden/webapp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Determine release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "Release tag is required." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Verify Bun version
        run: test "$(bun --version)" = "1.4.0"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set package version
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Verify package version
        run: |
          EXPECTED="${{ steps.release.outputs.version }}"
          ACTUAL="$(jq -r '.version' package.json)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Version mismatch. Expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test build binary integration
        run: bun run test:build-binary

      - name: Test remaining suites
        run: bun run test:remaining

      - name: Build examples
        run: bun run build:examples

      - name: Publish package
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm publish --tag unstable --provenance --access public
          else
            npm publish --provenance --access public
          fi
